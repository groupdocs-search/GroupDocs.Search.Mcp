name: Publish Docker Image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as Docker image tag (must match build/dependencies.props, e.g. 26.4.0)'
        required: true
        type: string

jobs:
  publish_docker:
    # Accept either tag push or workflow_dispatch with a version input.
    # Branch dispatches without a version are skipped so we never tag `:latest` at a random commit.
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # DOCKER-FIRST: GHCR is the release-critical registry — .mcp/server.json publishes
      # an OCI package pointing at ghcr.io, and GHCR authenticates with the built-in
      # GITHUB_TOKEN (no secret needed). The Docker Hub mirror is best-effort: if
      # DOCKERHUB_USERNAME/TOKEN are not configured for this org, we skip the Hub login
      # and push GHCR tags only, rather than failing the whole release.
      # To enable the Hub mirror later, just add the two secrets — no workflow change.
      - name: Determine available registries
        id: reg
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "dockerhub=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials present - will mirror to Docker Hub."
          else
            echo "dockerhub=false" >> $GITHUB_OUTPUT
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set - pushing to GHCR only."
          fi

      - uses: actions/checkout@v4

      - name: Set image names
        id: images
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "ghcr=ghcr.io/${OWNER,,}/search-net-mcp" >> $GITHUB_OUTPUT
          echo "dockerhub=groupdocs/search-net-mcp" >> $GITHUB_OUTPUT

      - name: Resolve and validate version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' does not match YY.MM.N (e.g. 26.4.0)."
            exit 1
          fi

          EXPECTED=$(grep -oP '<GroupDocsSearchMcp>\K[^<]+' build/dependencies.props | head -1)
          if [[ "$EXPECTED" != "$VERSION" ]]; then
            echo "::error::build/dependencies.props has <GroupDocsSearchMcp>$EXPECTED</...>, but release version is '$VERSION'."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing Docker image for version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.reg.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the tag list here rather than inline: GHCR always, Docker Hub only when
      # its credentials exist. Multi-line step output uses the heredoc delimiter form.
      - name: Compose image tags
        id: tags
        shell: bash
        run: |
          {
            echo "list<<TAGS_EOF"
            echo "${{ steps.images.outputs.ghcr }}:${{ steps.version.outputs.version }}"
            echo "${{ steps.images.outputs.ghcr }}:latest"
            if [[ "${{ steps.reg.outputs.dockerhub }}" == "true" ]]; then
              echo "${{ steps.images.outputs.dockerhub }}:${{ steps.version.outputs.version }}"
              echo "${{ steps.images.outputs.dockerhub }}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
